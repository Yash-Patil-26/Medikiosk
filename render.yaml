services:
  # Backend API Service
  - type: web
    name: medikiosk-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: medikiosk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: mock
      - key: ASR_PROVIDER
        value: browser
      - key: TTS_PROVIDER
        value: browser
      - key: PROVIDER_MODE
        value: mock
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: medikiosk-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medikiosk-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: medikiosk-db
    databaseName: medikiosk
    user: medikiosk
    plan: free
    postgresMajorVersion: "15"